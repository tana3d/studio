[package]
name = "tana-studio"
version = "0.2.1"
description = "Tana Studio desktop scene and video editor"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "tana_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
zeroize = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["sync", "macros", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

zega = { git = "https://github.com/zegadb/zega", rev = "4ecaf43064c7320cd9d587fc68f21919e50ebc1d", default-features = false }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSEvent", "block2"] }
block2 = "0.6"
