name: Studio distribution
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Select a version tag; false builds test bundles without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
  NEXT_TELEMETRY_DISABLED: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'

jobs:
  validate:
    if: github.repository == 'tana3d/studio' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate version tag and main ancestry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs validate
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: node tests/controls-ui.mjs

  bundle:
    needs: validate
    if: github.repository == 'tana3d/studio' && startsWith(github.ref, 'refs/tags/v')
    name: Bundle ${{ matrix.platform }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: win32-x64
            runner: windows-2025
          - platform: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RELEASE_PLATFORM: ${{ matrix.platform }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/.target
      CARGO_PROFILE_TEST_DEBUG: '0'
      APPLE_SIGNING_IDENTITY: "${{ (github.event_name == 'push' || inputs.publish == true) && 'Developer ID Application: Sami Fouad (6LV9UQMTRU)' || '-' }}"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> ../.target
          key: release-${{ matrix.platform }}
      - name: Linux build and converter dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgl1 libegl1 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 libsm6
      - name: Prepare Apple signing
        if: runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: node scripts/apple-keychain.mjs
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: node scripts/release.mjs configure
      - name: Build installer (sign and notarize macOS for publication)
        env:
          APPLE_ID: ${{ runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: 6LV9UQMTRU
          APPLE_API_KEY: ${{ runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true' && secrets.APPLE_API_ISSUER || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri -- build --config .tmp/release-config.json
      - run: npm run check
      - name: Verify the bundled Blender converter
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            src-tauri/converter/runtime/python.exe -I tests/model-converter.py
          elif [ "$RUNNER_OS" = macOS ]; then
            .target/release/bundle/macos/Studio.app/Contents/Resources/converter/runtime/bin/python3 -I tests/model-converter.py
          else
            src-tauri/converter/runtime/bin/python3 -I tests/model-converter.py
          fi
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Verify macOS distribution signature and notarization ticket
        if: runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true'
        run: |
          codesign --verify --deep --strict .target/release/bundle/macos/Studio.app
          xcrun stapler validate .target/release/bundle/macos/Studio.app
          spctl --assess --type execute --verbose .target/release/bundle/macos/Studio.app
      - run: node scripts/release.mjs collect
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: .tmp/release/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true'
        run: node scripts/apple-keychain.mjs cleanup

  source:
    needs: validate
    if: github.repository == 'tana3d/studio' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package corresponding source alongside the installers
        run: |
          mkdir -p .tmp/source
          git archive --format=tar.gz HEAD > .tmp/source/studio-source.tar.gz
          curl --fail --location --retry 3 https://download.blender.org/source/blender-4.5.14.tar.xz -o .tmp/source/blender-4.5.14.tar.xz
          xz --test .tmp/source/blender-4.5.14.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: corresponding-source
          path: .tmp/source/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [bundle, source]
    concurrency:
      group: studio-release-publisher
      cancel-in-progress: false
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          path: .tmp/artifacts
      - name: Check every installer and source archive
        run: node scripts/release.mjs assemble .tmp/artifacts
      - name: Upload installers, verify R2 readback, then update the website manifest
        if: env.RELEASE_PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/release.mjs publish .tmp/artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-manifest
          path: .tmp/release/manifest.json
          retention-days: 7
      - name: Publish release notes and download links
        if: env.RELEASE_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs
