name: Studio distribution
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Select a version tag; false builds test bundles without publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: studio-release-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_PUBLISH: ${{ github.event_name == 'push' || inputs.publish == true }}
  NEXT_TELEMETRY_DISABLED: '1'
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '2'
  R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
  R2_BUCKET: ${{ vars.R2_BUCKET }}

jobs:
  validate:
    if: github.repository == 'tana3d/studio' && startsWith(github.ref, 'refs/tags/v')
    runs-on:
      group: studio-releases
      labels: [self-hosted, studio, demon]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - name: Validate version tag and main ancestry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs validate
      - run: npm run build
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: node tests/controls-ui.mjs

  bundle:
    needs: validate
    if: github.repository == 'tana3d/studio' && startsWith(github.ref, 'refs/tags/v')
    name: Bundle ${{ matrix.platform }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            machine: bugsy
            target: aarch64-apple-darwin
            container: ''
            cache_port: '42371'
          - platform: darwin-x64
            machine: bugsy
            target: x86_64-apple-darwin
            container: ''
            cache_port: '42372'
          - platform: linux-x64
            machine: demon
            target: x86_64-unknown-linux-gnu
            container: ubuntu:24.04
            cache_port: '42373'
    runs-on:
      group: studio-releases
      labels: [self-hosted, studio, '${{ matrix.machine }}']
    container: ${{ matrix.container }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_TARGET: ${{ matrix.target }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
      RUSTC_WRAPPER: sccache
      SCCACHE_SERVER_PORT: ${{ matrix.cache_port }}
      SCCACHE_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      SCCACHE_REGION: auto
      SCCACHE_BUCKET: tana-studio-sccache-${{ matrix.platform }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      CARGO_PROFILE_TEST_DEBUG: '0'
      APPLE_SIGNING_IDENTITY: "${{ (github.event_name == 'push' || inputs.publish == true) && 'Developer ID Application: Sami Fouad (6LV9UQMTRU)' || '-' }}"
    steps:
      - name: Bootstrap Linux build container
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y curl ca-certificates git build-essential pkg-config xz-utils file
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Use the runner's local build cache
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TOOL_CACHE/studio-target/$RELEASE_PLATFORM" >> "$GITHUB_ENV"
          echo "BUNDLE_ROOT=$RUNNER_TOOL_CACHE/studio-target/$RELEASE_PLATFORM/$RELEASE_TARGET/release/bundle" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: ${{ matrix.target }}
          components: clippy,rustfmt
      - name: Linux build and converter dependencies
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgl1 libegl1 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 libsm6 libxt6
      - name: Prepare Apple signing
        if: runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: node scripts/apple-keychain.mjs
      - run: npm ci --no-audit --no-fund
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
        with:
          version: v0.18.0
          disable_annotations: true
      - name: Require the cache-only R2 credential
        run: node scripts/check-rust-cache.mjs
      - name: Start this job's isolated compiler cache server
        run: |
          sccache --stop-server || true
          sccache --start-server
      - run: npm test
      - run: node scripts/release.mjs configure
      - name: Build installer (sign and notarize macOS for publication)
        env:
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: 6LV9UQMTRU
          APPLE_API_KEY: ${{ runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true' && secrets.APPLE_API_ISSUER || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" != macOS ] || [ "$RELEASE_PUBLISH" != true ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          fi
          npm run tauri -- build --verbose --target "$RELEASE_TARGET" --config .tmp/release-config.json
      - name: Create the branded macOS installer without Finder automation
        if: runner.os == 'macOS'
        run: |
          python="$BUNDLE_ROOT/macos/Studio.app/Contents/Resources/converter/runtime/bin/python3"
          "$python" -I -B -m pip install --no-compile --only-binary=:all: --require-hashes --target .tmp/dmg-tools -r scripts/dmg-requirements.txt
          "$python" -I -B scripts/build-installer.py --bundle-root "$BUNDLE_ROOT" --target "$RELEASE_TARGET"
      - run: npm run check
      - name: Verify the bundled Blender converter
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            "$BUNDLE_ROOT/macos/Studio.app/Contents/Resources/converter/runtime/bin/python3" -I -B tests/model-converter.py "$BUNDLE_ROOT/macos/Studio.app/Contents/Resources/converter/convert.py"
          else
            mkdir -p .tmp/appimage-verification
            installer=$(find "$BUNDLE_ROOT/appimage" -maxdepth 1 -name "Studio_*.AppImage" -type f)
            test "$(printf '%s\n' "$installer" | wc -l)" -eq 1
            (cd .tmp/appimage-verification && "$installer" --appimage-extract >/dev/null)
            python=$(find .tmp/appimage-verification/squashfs-root -path '*/converter/runtime/bin/python3')
            test -x "$python"
            test "$(printf '%s\n' "$python" | wc -l)" -eq 1
            "$python" -I -B tests/model-converter.py "${python%/runtime/bin/python3}/convert.py"
          fi
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --locked --release --target "$RELEASE_TARGET" --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --release --target "$RELEASE_TARGET" --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Verify macOS distribution signature and notarization ticket
        if: runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true'
        run: |
          codesign --verify --deep --strict "$BUNDLE_ROOT/macos/Studio.app"
          xcrun stapler validate "$BUNDLE_ROOT/macos/Studio.app"
          spctl --assess --type execute --verbose "$BUNDLE_ROOT/macos/Studio.app"
          installer=$(find "$BUNDLE_ROOT/dmg" -maxdepth 1 -name "Studio_*.dmg" -type f)
          codesign --verify --strict "$installer"
      - run: node scripts/release.mjs collect
      - name: Transfer signed installers to R2 staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/release-transfer.mjs upload installer-${{ matrix.platform }} .tmp/release
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Stop this job's compiler cache server
        if: always()
        run: sccache --stop-server
      - name: Remove temporary signing keychain
        if: always() && runner.os == 'macOS' && env.RELEASE_PUBLISH == 'true'
        run: node scripts/apple-keychain.mjs cleanup

      - name: Return container files to the runner account
        if: always() && runner.os == 'Linux'
        run: chown -R "$(stat -c %u "$GITHUB_WORKSPACE"):$(stat -c %g "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE" "$CARGO_TARGET_DIR"

  source:
    needs: validate
    environment: release
    if: github.repository == 'tana3d/studio' && startsWith(github.ref, 'refs/tags/v')
    runs-on:
      group: studio-releases
      labels: [self-hosted, studio, demon]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package corresponding source alongside the installers
        run: |
          mkdir -p .tmp/source
          git archive --format=tar.gz HEAD > .tmp/source/studio-source.tar.gz
          curl --fail --location --retry 3 https://download.blender.org/source/blender-4.5.14.tar.xz -o .tmp/source/blender-4.5.14.tar.xz
          xz --test .tmp/source/blender-4.5.14.tar.xz
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - name: Transfer corresponding source to R2 staging
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/release-transfer.mjs upload corresponding-source .tmp/source

  publish:
    needs: [bundle, source]
    concurrency:
      group: studio-release-publisher
      cancel-in-progress: false
    permissions:
      contents: write
    environment: release
    runs-on:
      group: studio-releases
      labels: [self-hosted, studio, demon]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: npm ci --no-audit --no-fund
      - name: Retrieve release files from R2 and verify checksums
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/release-transfer.mjs download .tmp/artifacts
      - name: Check every installer and source archive
        run: node scripts/release.mjs assemble .tmp/artifacts
      - name: Upload installers, verify R2 readback, then update the website manifest
        if: env.RELEASE_PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: node scripts/release.mjs publish .tmp/artifacts
      - name: Publish release notes and download links
        if: env.RELEASE_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/github-release.mjs
